name: Validate static dashboard

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-static-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate static dashboard structure and public exports
        run: python scripts/validate_static_dashboard.py
